name: Explorer – décortiquer (REA)
on:
  workflow_dispatch:
  schedule: [{ cron: "*/10 * * * *" }]
concurrency: { group: explorer-decortiquer, cancel-in-progress: false }
jobs:
  decortiquer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: File d'attente
        id: file
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN2 || secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: |
          n=$(curl -s -X POST "https://api.supabase.com/v1/projects/fbsjbnnmzazylmquzryo/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -H "User-Agent: bingoo-ci" \
            -d '{"query":"select count(*)::int n from public.saas_decortique where (statut = '"'"'attente'"'"' or (statut = '"'"'en_cours'"'"' and at < now() - interval '"'"'12 minutes'"'"')) and essais < 3"}' | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['n'])" || echo 0)
          echo "n=$n" >> "$GITHUB_OUTPUT"; echo "À décortiquer : $n"
      - name: REA (paquet npm officiel rea-agents)
        if: steps.file.outputs.n != '0'
        run: mkdir -p /tmp/rea && cd /tmp/rea && npm init -y >/dev/null && npm i rea-agents@6.9.0 --no-audit --no-fund
      - name: Navigateur Chrome sans fenêtre (profil jetable, port local)
        if: steps.file.outputs.n != '0'
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/rea-profil about:blank > /tmp/chrome.log 2>&1 &
          for i in $(seq 1 20); do curl -s http://127.0.0.1:9222/json/version >/dev/null && break; sleep 1; done
          curl -s "http://127.0.0.1:9222/json/new?https://example.com" -X PUT > /dev/null || true
      - name: Analyse REA des pages publiques
        if: steps.file.outputs.n != '0'
        working-directory: /tmp/rea
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN2 || secrets.SUPABASE_ACCESS_TOKEN }}", MAX: "6", MINUTES: "25" }
        run: node "$GITHUB_WORKSPACE/scripts/explorer/decortiquer.cjs"
