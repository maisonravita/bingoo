name: Sauvegarde de la base

# Chaque dimanche à 4 h (heure de Paris) : copie complète de la base, chiffrée, rangée HORS de GitHub et de Supabase
# (Cloudflare R2). Jamais en artefact GitHub : le dépôt peut être public.
# Secrets GitHub nécessaires (Settings → Secrets and variables → Actions) :
#   SUPABASE_DB_URL     adresse de connexion (Supabase → Connect → Session pooler)
#   BACKUP_PASSPHRASE   phrase secrète pour chiffrer la copie (à garder précieusement : sans elle, la copie est illisible)
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET   accès Cloudflare R2 (jeton limité à ce seul bucket)
# Sans les accès R2, la sauvegarde ne se fait pas (elle n'est jamais publiée ailleurs).
on:
  schedule: [{ cron: "0 3 * * 0" }]
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Copie chiffrée
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN2 || secrets.SUPABASE_ACCESS_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then echo "Secrets absents : sauvegarde ignorée" >> $GITHUB_STEP_SUMMARY; exit 0; fi
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then echo "Pas de lieu de stockage hors GitHub (accès Cloudflare R2 absents) : sauvegarde ignorée" >> $GITHUB_STEP_SUMMARY; exit 0; fi
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          f="bingoo-$(date -u +%Y-%m-%d).dump"
          if ! pg_dump "$DB_URL" --format=custom --no-owner --no-privileges --schema=public --schema=auth -f "$f"; then
            echo "pg_dump impossible : sauvegarde de secours par l'API (données du schéma public en JSON)" >> $GITHUB_STEP_SUMMARY
            [ -n "$SUPABASE_ACCESS_TOKEN" ] || exit 1
            node scripts/backup-api.mjs
            f="bingoo-$(date -u +%Y-%m-%d)-json.tar.gz"; tar czf "$f" sauvegarde; rm -rf sauvegarde
          fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" -out "$f.enc" -pass env:PASS
          rm "$f"
          # Envoi vers Cloudflare R2 (API compatible S3) ; le fichier ne quitte le robot que chiffré
          AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto \
            aws s3 cp "$f.enc" "s3://$R2_BUCKET/bingoo/$f.enc" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors
          echo "- $f.enc ($(du -h "$f.enc" | cut -f1)) rangée dans Cloudflare R2" >> $GITHUB_STEP_SUMMARY
          rm "$f.enc"
