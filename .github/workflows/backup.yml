name: Sauvegarde de la base

# Chaque dimanche à 4 h (heure de Paris) : copie complète de la base, chiffrée, gardée 30 jours dans GitHub.
# Nécessite deux secrets GitHub (Settings → Secrets and variables → Actions) :
#   SUPABASE_DB_URL     adresse de connexion (Supabase → Connect → Session pooler)
#   BACKUP_PASSPHRASE   phrase secrète pour chiffrer la copie (à garder précieusement : sans elle, la copie est illisible)
on:
  schedule: [{ cron: "0 3 * * 0" }]
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Copie chiffrée
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then echo "Secrets absents : sauvegarde ignorée" >> $GITHUB_STEP_SUMMARY; exit 0; fi
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          f="bingoo-$(date -u +%Y-%m-%d).dump"
          pg_dump "$DB_URL" --format=custom --no-owner --no-privileges --schema=public --schema=auth -f "$f"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" -out "$f.enc" -pass env:PASS
          rm "$f"
          echo "- $f.enc ($(du -h "$f.enc" | cut -f1))" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('*.enc') != '' }}
        with: { name: sauvegarde-base, path: "*.enc", retention-days: 30 }
