# Sauvegarde quotidienne gratuite de la base (en attendant Supabase Pro).
# La copie est chiffrée (AES-256) avec BACKUP_PASSPHRASE avant d'être stockée 30 jours dans GitHub.
# Restauration : gpg -d bingoo-AAAA-MM-JJ.sql.gpg > dump.sql  puis  psql "<base cible>" -f dump.sql
name: Bingoo sauvegarde

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASS: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Vérification des secrets
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then echo "Secrets SUPABASE_DB_URL ou BACKUP_PASSPHRASE absents" >> $GITHUB_STEP_SUMMARY; exit 1; fi
      - name: Copie de la base (Postgres 17)
        run: |
          d=$(date -u +%F)
          # L'hôte du pooler peut être aws-0 ou aws-1 selon le projet : on essaie les deux
          for u in "$DB_URL" "$(echo "$DB_URL" | sed 's/aws-0-/aws-1-/')" "$(echo "$DB_URL" | sed 's/aws-1-/aws-0-/')"; do
            docker run --rm -e PGURL="$u" -v "$PWD:/out" postgres:17 \
              sh -c 'pg_dump "$PGURL" --no-owner --no-privileges --schema=public --schema=auth --schema=cron -f /out/dump.sql' && break
          done
          test -s dump.sql
          echo "$PASS" | gpg --batch --yes --passphrase-fd 0 --symmetric --cipher-algo AES256 -o bingoo-$d.sql.gpg dump.sql
          shred -u dump.sql
          echo "- sauvegarde chiffrée : $(du -h bingoo-$d.sql.gpg | cut -f1)" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-${{ github.run_id }}
          path: bingoo-*.sql.gpg
          retention-days: 30
