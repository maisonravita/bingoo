name: Essai du contrat de données
on: { workflow_dispatch: {} }
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --ignore-scripts esbuild@0.24.0 playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/contrat-essai.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN2 || secrets.SUPABASE_ACCESS_TOKEN }}
