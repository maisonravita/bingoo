name: Captures connectées
on:
  workflow_dispatch:
    inputs:
      construire: { description: "Vraie construction à photographier : vide, modele ou ia (consomme du crédit IA)", required: false, default: "" }
      domaine: { description: "SaaS d'origine pour une construction ia (facultatif)", required: false, default: "" }
      idee: { description: "1 = photographier aussi le parcours « Construire mon idée » (aperçus : petits appels d'IA)", required: false, default: "0" }
      local: { description: "1 = tester le site construit depuis main (servi par le robot) au lieu de bingoo.fr", required: false, default: "0" }
permissions:
  contents: write
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      # Site construit depuis main et servi sur place (quand la mise en ligne Vercel est en retard ou bloquée)
      - name: Site local
        if: ${{ github.event.inputs.local == '1' }}
        run: |
          npm install --no-audit --no-fund && npm run build:site && npm i --no-save playwright@1.48.2
          (npx vite preview -c vite.single.config.js --port 4173 --strictPort > /tmp/preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          echo "SITE=http://localhost:4173" >> $GITHUB_ENV
      - name: Photographier
        run: node scripts/e2e/captures.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN2 || secrets.SUPABASE_ACCESS_TOKEN }}
          CONSTRUIRE: ${{ github.event.inputs.construire }}
          DOMAINE: ${{ github.event.inputs.domaine }}
          IDEE: ${{ github.event.inputs.idee }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: captures, path: captures, retention-days: 7 }
      # Les images sont aussi poussées sur la branche « captures-robot » (lisible sans télécharger d'artefact)
      - name: Publier sur la branche captures-robot
        if: always()
        run: |
          cd captures && git init -q && git checkout -q -b captures-robot
          # Pas de déploiement Vercel pour cette branche d'images (le quota de mises en ligne est limité)
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git config user.name "bingoo-robot" && git config user.email "robot@bingoo.fr"
          git add -A && git commit -q -m "Captures du $(date -u +%F\ %H:%M)" || exit 0
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" captures-robot
