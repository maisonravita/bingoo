name: Explorer – newsletters
on:
  workflow_dispatch:
    inputs: { max: { description: "Nombre de SaaS", default: "30" } }
  schedule: [{ cron: "10 3 * * *" }]
jobs:
  inscription:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Inscription aux newsletters publiques
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN2 || secrets.SUPABASE_ACCESS_TOKEN }}", MAX: "${{ github.event.inputs.max || '30' }}" }
        run: node scripts/explorer/newsletters.cjs
