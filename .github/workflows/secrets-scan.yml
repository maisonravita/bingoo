name: Scan des secrets (historique complet)
# Lancé à la main : cherche des clés dans TOUT l'historique Git. Les valeurs sont masquées (--redact) : rien ne fuit dans le journal.
on:
  workflow_dispatch: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          v=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/$v/gitleaks_${v#v}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --redact --no-banner --report-format json --report-path rapport.json --exit-code 0 -v 2>&1 | grep -E "RuleID|File|Commit|Date|leaks found|no leaks" | grep -vE "^Secret|^Match" || true
          python3 -c "import json;r=json.load(open('rapport.json'));print(len(r),'résultat(s)');[print(x['RuleID'],x['File'],x['Commit'][:8],x['Date'][:10]) for x in r]"
