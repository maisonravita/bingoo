name: Test de nuit (site en ligne)
on:
  workflow_dispatch:
  schedule: [{ cron: "53 2 * * *" }]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Parcours clés
        run: node scripts/e2e/nuit.mjs
