name: Vouvoiement des SaaS livrés
on: { workflow_dispatch: {} }
jobs:
  vous:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Conversion
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN2 || secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: python3 scripts/vous/appliquer.py
