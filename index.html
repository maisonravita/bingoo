    <style>
      html,body{margin:0;height:100%}
      .bingoo-splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(circle at 50% 45%,#F0682F 0%,#E0531F 55%,#C9461A 100%);overflow:hidden}
      .bingoo-splash-logo{position:relative;width:min(56vw,250px);height:auto;animation:splash-logo 1.6s ease-in-out infinite}
      .bingoo-splash-waves{position:absolute;left:50%;top:50%;width:0;height:0}
      .bingoo-splash-waves span{position:absolute;left:-160px;top:-160px;width:320px;height:320px;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:splash-wave 2.4s cubic-bezier(.2,.6,.3,1) infinite;opacity:0}
      .bingoo-splash-waves span:nth-child(2){animation-delay:.8s}.bingoo-splash-waves span:nth-child(3){animation-delay:1.6s}
      .bingoo-splash-dots{position:relative;display:flex;gap:8px}
      .bingoo-splash-dots span{width:9px;height:9px;border-radius:50%;background:#fff;animation:splash-dot 1.1s ease-in-out infinite}
      .bingoo-splash-dots span:nth-child(2){animation-delay:.15s}.bingoo-splash-dots span:nth-child(3){animation-delay:.3s}
      @keyframes splash-logo{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
      @keyframes splash-wave{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.9);opacity:0}}
      @keyframes splash-dot{0%,80%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-7px);opacity:1}}
      @media (prefers-reduced-motion:reduce){.bingoo-splash *{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="root"><div class="bingoo-splash" role="status" aria-label="Chargement"><div class="bingoo-splash-waves" aria-hidden="true"><span></span><span></span><span></span></div><img src="/src/assets/logo-mono-white.png" alt="Kairo!" class="bingoo-splash-logo" /><div class="bingoo-splash-dots" aria-hidden="true"><span></span><span></span><span></span></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
