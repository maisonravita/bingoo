    <style>
      html,body{margin:0;height:100%}
.bingoo-splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;background:radial-gradient(circle at 50% 45%,#F0682F 0%,#E0531F 55%,#C9461A 100%);overflow:hidden}
.bingoo-splash-waves{position:absolute;left:50%;top:50%;width:0;height:0}
.bingoo-splash-waves span{position:absolute;left:-180px;top:-180px;width:360px;height:360px;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:splash-wave 2.4s cubic-bezier(.2,.6,.3,1) infinite;opacity:0}
.bingoo-splash-waves span:nth-child(2){animation-delay:.8s}.bingoo-splash-waves span:nth-child(3){animation-delay:1.6s}
.bingoo-splash-word{position:relative;display:flex;align-items:flex-end;font-family:Nunito,"Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;font-weight:900;font-size:min(21vw,150px);line-height:1;color:#fff;letter-spacing:-.02em;transform:skewX(-8deg)}
.bingoo-splash-word .bl{position:relative;display:inline-block;opacity:0;transform:translateY(60%) scale(.4);animation:splash-letter .6s cubic-bezier(.34,1.56,.64,1) both}
.bingoo-splash-word .bx{position:relative;display:inline-block;margin-left:.04em}
.bingoo-splash-word .bx-bang{display:inline-block;transform-origin:50% 90%;opacity:0;animation:splash-bang .6s 1.9s cubic-bezier(.34,1.8,.64,1) both,splash-shake .55s 2.5s ease-in-out infinite}
.bingoo-splash-word .bx-sparks{position:absolute;left:50%;top:.06em;width:0;height:0}
.bingoo-splash-word .bx-sparks i{position:absolute;left:-.035em;top:0;width:.07em;height:.2em;border-radius:.05em;background:#fff;transform-origin:50% 150%;opacity:0;animation:splash-spark-in .5s 1.35s ease-out forwards,splash-spark-pulse 1.2s 1.9s ease-in-out infinite}
.bingoo-splash-word .bx-sparks i:nth-child(1){--r:-38deg}.bingoo-splash-word .bx-sparks i:nth-child(2){--r:0deg}.bingoo-splash-word .bx-sparks i:nth-child(3){--r:38deg}
.bingoo-splash-dots{position:relative;display:flex;gap:8px}
.bingoo-splash-dots span{width:9px;height:9px;border-radius:50%;background:#fff;animation:splash-dot 1.1s ease-in-out infinite}
.bingoo-splash-dots span:nth-child(2){animation-delay:.15s}.bingoo-splash-dots span:nth-child(3){animation-delay:.3s}
@keyframes splash-letter{to{opacity:1;transform:none}}
@keyframes splash-bang{0%{opacity:0;transform:scale(0) rotate(-25deg)}60%{opacity:1;transform:scale(1.5) rotate(10deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes splash-shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg) scale(1.08)}30%{transform:rotate(12deg) scale(1.08)}45%{transform:rotate(-9deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
@keyframes splash-spark-in{0%{opacity:0;transform:rotate(var(--r)) translateY(-.08em) scaleY(.3)}100%{opacity:1;transform:rotate(var(--r)) translateY(-.2em) scaleY(1)}}
@keyframes splash-spark-pulse{0%,100%{opacity:1;transform:rotate(var(--r)) translateY(-.2em) scaleY(1)}50%{opacity:.6;transform:rotate(var(--r)) translateY(-.26em) scaleY(.8)}}
@keyframes splash-wave{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes splash-dot{0%,80%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-7px);opacity:1}}
@media (prefers-reduced-motion:reduce){.bingoo-splash *{animation:none!important;opacity:1!important;transform:none!important}}
    </style>

  <body>
    <div id="root"><div class="bingoo-splash" role="status" aria-label="Chargement"><div class="bingoo-splash-waves" aria-hidden="true"><span></span><span></span><span></span></div><div class="bingoo-splash-word" aria-label="Bingoo!"><span class="bl" style="animation-delay:0.00s">B</span><span class="bl" style="animation-delay:0.15s">i</span><span class="bl" style="animation-delay:0.30s">n</span><span class="bl" style="animation-delay:0.45s">g</span><span class="bl" style="animation-delay:0.60s">o</span><span class="bl bo" style="animation-delay:0.75s">o<span class="bx-sparks" aria-hidden="true"><i></i><i></i><i></i></span></span><span class="bx"><span class="bx-bang">!</span></span></div><div class="bingoo-splash-dots" aria-hidden="true"><span></span><span></span><span></span></div></div></div>
