    <style>
      html,body{margin:0;height:100%}
.bingoo-splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(circle at 50% 45%,#F0682F 0%,#E0531F 55%,#C9461A 100%);overflow:hidden}
.bingoo-splash-waves{position:absolute;left:50%;top:50%;width:0;height:0}
.bingoo-splash-waves span{position:absolute;left:-180px;top:-180px;width:360px;height:360px;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:splash-wave 2.4s cubic-bezier(.2,.6,.3,1) infinite;opacity:0}
.bingoo-splash-waves span:nth-child(2){animation-delay:.8s}.bingoo-splash-waves span:nth-child(3){animation-delay:1.6s}
.bingoo-splash-word{position:relative;width:min(80vw,480px);aspect-ratio:420/172;filter:drop-shadow(0 6px 18px rgba(120,30,0,.25))}
.bingoo-splash-word img{position:absolute;top:0;height:100%;max-width:none;user-select:none;-webkit-user-drag:none}
.bingoo-splash-word .bl{opacity:0;transform:translateY(35%) scale(.5);transform-origin:50% 80%;animation:splash-letter .6s cubic-bezier(.34,1.56,.64,1) both}
.bingoo-splash-word .bsp{opacity:0;transform-origin:50% 36%;animation:splash-spark-in .55s 1.35s cubic-bezier(.34,1.7,.64,1) forwards,splash-spark-pulse 1.2s 1.95s ease-in-out infinite}
.bingoo-splash-word .bbg{opacity:0;transform-origin:50% 85%;animation:splash-bang .6s 1.9s cubic-bezier(.34,1.8,.64,1) both,splash-shake .55s 2.5s ease-in-out infinite}
.bingoo-splash-dots{position:relative;display:flex;gap:8px}
.bingoo-splash-dots span{width:9px;height:9px;border-radius:50%;background:#fff;animation:splash-dot 1.1s ease-in-out infinite}
.bingoo-splash-dots span:nth-child(2){animation-delay:.15s}.bingoo-splash-dots span:nth-child(3){animation-delay:.3s}
@keyframes splash-letter{to{opacity:1;transform:none}}
@keyframes splash-spark-in{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
@keyframes splash-spark-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.12)}}
@keyframes splash-bang{0%{opacity:0;transform:scale(0) rotate(-25deg)}60%{opacity:1;transform:scale(1.5) rotate(10deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes splash-shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg) scale(1.08)}30%{transform:rotate(12deg) scale(1.08)}45%{transform:rotate(-9deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
@keyframes splash-wave{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes splash-dot{0%,80%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-7px);opacity:1}}
#bingoo-splash{z-index:200}
.bingoo-splash.out{opacity:0;transition:opacity .55s ease}
@media (prefers-reduced-motion:reduce){.bingoo-splash *{animation:none!important;opacity:1!important;transform:none!important}}
.bingoo-splash-played .bingoo-splash-word .bl{animation:none;opacity:1;transform:none}
.bingoo-splash-played .bingoo-splash-word .bsp{opacity:1;animation:splash-spark-pulse 1.2s ease-in-out infinite}
.bingoo-splash-played .bingoo-splash-word .bbg{opacity:1;animation:splash-shake .55s ease-in-out infinite}
    </style>

  <body>
    <div id="bingoo-splash" class="bingoo-splash" role="status" aria-label="Chargement"><div class="bingoo-splash-waves" aria-hidden="true"><span></span><span></span><span></span></div><div class="bingoo-splash-word" role="img" aria-label="Bingoo!"><img src="/src/assets/splash/B.png" alt="" class="bl" style="left:0.000%;width:19.286%;animation-delay:0.00s;" /><img src="/src/assets/splash/i.png" alt="" class="bl" style="left:19.286%;width:7.143%;animation-delay:0.15s;" /><img src="/src/assets/splash/n.png" alt="" class="bl" style="left:26.429%;width:16.429%;animation-delay:0.30s;" /><img src="/src/assets/splash/g.png" alt="" class="bl" style="left:42.857%;width:16.905%;animation-delay:0.45s;" /><img src="/src/assets/splash/o1.png" alt="" class="bl" style="left:59.762%;width:15.476%;animation-delay:0.60s;" /><img src="/src/assets/splash/o2.png" alt="" class="bl" style="left:75.238%;width:15.238%;animation-delay:0.75s;" /><img src="/src/assets/splash/sparks.png" alt="" class="bsp" style="left:59.524%;width:26.429%;" /><img src="/src/assets/splash/bang.png" alt="" class="bbg" style="left:90.476%;width:9.524%;" /></div><div class="bingoo-splash-dots" aria-hidden="true"><span></span><span></span><span></span></div></div>
